<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23F04B20'/><text x='50%' y='68%' font-size='60' font-weight='900' fill='white' font-family='sans-serif' text-anchor='middle'>SR</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subrata Roy — .NET Backend Developer | Software Engineer | AI Engineering Enthusiast</title>
    <meta name="description" content="Portfolio of Subrata Roy — .NET Backend Developer and Software Engineer building intelligent digital experiences, scalable business systems, and modern APIs." />
    <meta name="keywords" content="Subrata Roy, .NET Developer, Backend Developer, C#, ASP.NET Core, SQL Server, Software Engineer, Durgapur, West Bengal" />
    <meta property="og:title" content="Subrata Roy — .NET Backend Developer" />
    <meta property="og:description" content="Building Intelligent Digital Experiences Through Code. .NET Backend Developer & Software Engineer." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Immediate Theme Hydration Script to prevent flash on reload -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('subrata_portfolio_theme');
          if (!raw) {
            var dataRaw = localStorage.getItem('subrata_portfolio_data_v5');
            if (dataRaw) {
              var d = JSON.parse(dataRaw);
              if (d && d.theme) raw = JSON.stringify(d.theme);
            }
          }
          if (raw) {
            var t = JSON.parse(raw);
            if (t && t.accent) {
              function h2rgb(hex) {
                var c = hex.replace('#', '').trim();
                if (c.length === 3) c = c.split('').map(function(x){return x+x;}).join('');
                var n = parseInt(c, 16);
                if (isNaN(n)) return '240 75 32';
                return ((n>>16)&255) + ' ' + ((n>>8)&255) + ' ' + (n&255);
              }
              function adj(hex, pct) {
                var c = hex.replace('#', '').trim();
                if (c.length === 3) c = c.split('').map(function(x){return x+x;}).join('');
                var n = parseInt(c, 16);
                if (isNaN(n)) return hex;
                var r = Math.min(255, Math.max(0, Math.round(((n>>16)&255)*(1+pct/100))));
                var g = Math.min(255, Math.max(0, Math.round(((n>>8)&255)*(1+pct/100))));
                var b = Math.min(255, Math.max(0, Math.round((n&255)*(1+pct/100))));
                var toH = function(x){return x.toString(16).padStart(2, '0');};
                return '#' + toH(r) + toH(g) + toH(b);
              }

              var r = document.documentElement;
              var accHov = t.accentHover || adj(t.accent, -15);
              var accLgt = t.accentLight || adj(t.accent, 20);
              var card = t.card || '#141418';
              var bg = t.background || '#09090b';
              var surf = adj(card, 15);
              var bord = adj(card, 28);
              var txt = t.text || '#ffffff';
              var txtMut = t.textMuted || '#a1a1aa';

              r.style.setProperty('--color-accent', h2rgb(t.accent));
              r.style.setProperty('--color-accent-hover', h2rgb(accHov));
              r.style.setProperty('--color-accent-light', h2rgb(accLgt));
              r.style.setProperty('--color-bg', h2rgb(bg));
              r.style.setProperty('--color-card', h2rgb(card));
              r.style.setProperty('--color-surface', h2rgb(surf));
              r.style.setProperty('--color-border', h2rgb(bord));
              r.style.setProperty('--color-text', h2rgb(txt));
              r.style.setProperty('--color-text-muted', h2rgb(txtMut));

              r.style.setProperty('--theme-accent', t.accent);
              r.style.setProperty('--theme-accent-hover', accHov);
              r.style.setProperty('--theme-accent-light', accLgt);
              r.style.setProperty('--theme-bg', bg);
              r.style.setProperty('--theme-card', card);
              r.style.setProperty('--theme-surface', surf);
              r.style.setProperty('--theme-border', bord);
              r.style.setProperty('--theme-text', txt);
              r.style.setProperty('--theme-text-muted', txtMut);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="selection:bg-brand-orange selection:text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
